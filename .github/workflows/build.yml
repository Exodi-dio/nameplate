name: Build Nameplate

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow for the font baker
        run: pip install pillow

      - name: Bake bundled font atlases
        run: python tools/bake.py

      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: "nightly"
          target: ${{ matrix.target }}
          build-config: Release
          combine: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Set up geode CLI
        uses: robinraju/release-downloader@v1.13
        with:
          repository: geode-sdk/cli
          latest: true
          tarBall: false
          zipBall: false
          fileName: "*-linux.zip"
          extract: true
          out-file-path: ./cli
      - run: echo "$PWD/cli" >> $GITHUB_PATH

      - name: Merge platform geodes
        run: |
          geode package merge --zstd \
            artifacts/geode-build-android32/exodi.nameplate.geode \
            artifacts/geode-build-android64/exodi.nameplate.geode

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: artifacts/geode-build-android32/exodi.nameplate.geode
